<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AAi Hyper | Vendor and Admin</title>
<style>
:root{--bg:#f4f7f2;--card:#fff;--ink:#17261d;--mut:#5d6d63;--pri:#1f6b45;--onpri:#fff;--line:#dbe4dc;--soft:#e7f1ea;--bad:#a12622;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f1913;--card:#17231c;--ink:#e8f0ea;--mut:#9fb1a5;--pri:#4cc38a;--onpri:#08130d;--line:#2a3a30;--soft:#1d2e24;--bad:#ff8a84;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Tamil",sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}
main{max-width:1100px;margin:0 auto;padding:20px}h1,h2{margin:0 0 10px}h2{font-size:18px;margin-top:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.kpi b{display:block;font-size:28px;color:var(--pri)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}.wrap{overflow-x:auto}
button,a.btn{font:inherit;border:0;border-radius:8px;background:var(--pri);color:var(--onpri);padding:8px 12px;min-height:40px;cursor:pointer;text-decoration:none;display:inline-block}
button.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}button.bad{background:var(--bad);color:#fff}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);min-height:40px;margin:2px 4px 2px 0}
.login{max-width:380px;margin:40px auto}.login input{width:100%;margin:6px 0}.err{color:var(--bad)}.mut{color:var(--mut)}
</style></head><body>
<header><b>AAi Hyper · Portal</b><span><span id="who" class="mut"></span> <button id="out" class="alt" hidden>Sign out</button></span></header>
<main id="m"><p class="mut">Loading…</p></main>
<script>
const API="/server/aai_api",$=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function api(p,method,body){const r=await fetch(API+p,{method:method||"GET",credentials:"same-origin",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error((j.error&&j.error.message)||"Error");e.status=r.status;throw e}return j}
let U=null,STORES=[],SELLERS=[],PST="PENDING",LST="no",DST="PENDING";
async function act(fn,then){try{await fn();await then();if(U&&U.role!=="ADMIN"&&$("bill"))billing()}catch(e){alert(e.message)}}
function loginCard(){$("m").innerHTML=`<div class="card login"><h1>Sign in</h1><p class="mut">Enter your mobile number. We will send a 6-digit code.</p>
<label for="ph"><b>Mobile number</b></label><input id="ph" type="tel" inputmode="numeric" maxlength="14" placeholder="98XXXXXXXX" autocomplete="tel"><button id="send">Send code</button>
<div id="step2" hidden><label for="cd"><b>6-digit code</b></label><input id="cd" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button id="ver">Sign in</button></div>
<p id="msg" class="err"></p><p class="mut" style="font-size:13px">Admins can also <a href="/__catalyst/auth/login">sign in with email</a>.</p></div>`;
$("send").onclick=async()=>{$("msg").textContent="";try{await api("/auth/otp/send","POST",{phone:$("ph").value});$("step2").hidden=false;$("cd").focus();$("msg").textContent="Code sent.";$("msg").className="mut"}catch(e){$("msg").className="err";$("msg").textContent=e.message}};
$("ver").onclick=async()=>{try{await api("/auth/otp/verify","POST",{phone:$("ph").value,code:$("cd").value});location.reload()}catch(e){$("msg").className="err";$("msg").textContent=e.message}}}
const bindUnlock=(then)=>document.querySelectorAll("[data-ul]").forEach(b=>b.onclick=()=>act(()=>api("/unlock","POST",{kind:b.dataset.ul,refId:b.dataset.id}),then));
async function billing(){let B;try{B=await api("/billing/me")}catch(e){return}const v=B.subs.find(x=>x.plan==="VENDOR"),I=B.billing,up=I.upi;
$("bill").innerHTML=`<div class="card"><b>Your plan:</b> ${v&&v.active?`<span style="color:var(--pri)">✔ active until ${esc(v.valid_until)} (${esc(v.daysLeft)} days left)</span>`:`Free customers left: <b>${esc(B.sample.left)}</b> of ${esc(B.sample.total)}${B.sample.left===0?` <b style="color:var(--bad)">· locked: pay to continue</b>`:""}`}
${v&&v.active&&v.daysLeft>5?"":`<details style="margin-top:8px"${B.sample.left===0&&!(v&&v.active)?" open":""}><summary>Pay ₹${esc(I.vendor.price)} for ${esc(I.vendor.days)} days</summary><p>${up.id?`Pay to UPI ID <b>${esc(up.id)}</b> (${esc(up.name)}). <a href="upi://pay?pa=${encodeURIComponent(up.id)}&pn=${encodeURIComponent(up.name||"AAi Hyper")}&am=${esc(I.vendor.price)}&cu=INR&tn=AAi%20Hyper%20VENDOR">Open UPI app</a>. Then enter the 12-digit UPI reference (UTR):`:"Payment details are not set up yet. Ask the admin."}</p>${up.id?`<input id="butr" inputmode="numeric" maxlength="12" placeholder="UPI reference (UTR)"><button id="bpay">I have paid</button>`:""}</details>`}
${B.payments.length?`<div class="mut" style="margin-top:6px">Payments: ${B.payments.map(p=>"₹"+esc(p.amount)+" "+esc(p.status)).join(" · ")}</div>`:""}</div>`;
if($("bpay"))$("bpay").onclick=()=>act(()=>api("/billing/pay","POST",{plan:"VENDOR",utr:$("butr").value}).then(()=>alert("Received. The admin will check it and start your plan.")),billing)}
let SUBF="expiring";
async function money(){const [rv,pp,sb,fu,st]=await Promise.all([api("/admin/revenue"),api("/admin/payments?status=PENDING"),api("/admin/subscriptions?filter="+SUBF),api("/admin/followups"),api("/admin/settings")]);
const f=n=>"₹"+Number(n).toLocaleString("en-IN"),K=(l,v,sub)=>`<div class="card kpi"><b>${v}</b>${l}${sub?`<br><span class="mut" style="font-size:12px">${sub}</span>`:""}</div>`;
const wa=(ph,m)=>`https://wa.me/91${esc(ph)}?text=${encodeURIComponent(m)}`;
const remind=x=>x.status==="LOCKED"?`Hello ${x.name}, you have used your free customers on AAi Hyper. Pay ${f(st.priceVendor)} for ${st.daysVendor} days to continue getting customers. UPI: ${st.upiId}. Send us the reference number after paying.`:`Hello ${x.name}, your AAi Hyper ${x.plan==="CLIENT"?"pass":"plan"} ${x.status==="EXPIRED"?"ended on":"ends on"} ${x.valid_until}. Renew for ${f(x.plan==="CLIENT"?st.priceClient:st.priceVendor)} (UPI: ${st.upiId}) and send us the reference number.`;
$("mon").innerHTML=`<h1>Money and follow-up</h1><div class="kpis">${K("This month",f(rv.thisMonth.gross),rv.thisMonth.count+" payments")}${K("Total collected",f(rv.total.gross),"net "+f(rv.total.net)+" + GST "+f(rv.total.gst))}${K("Today",f(rv.today.gross))}${K("Active clients",rv.active.CLIENT)}${K("Active vendors",rv.active.VENDOR)}${K("To confirm",rv.pendingPayments)}${K("Ending in 3 days",rv.expiringIn3)}${K("Renewals due in 7 days",f(rv.expectedRenewals7),rv.expiringIn7+" people")}</div>
<div class="card wrap"><table><tr><th>Month</th><th>Payments</th><th>Collected</th><th>Net</th><th>GST</th></tr>${rv.months.map(m=>`<tr><td>${esc(m.month)}</td><td>${esc(m.count)}</td><td>${f(m.gross)}</td><td>${f(m.net)}</td><td>${f(m.gst)}</td></tr>`).join("")}</table><p class="mut">Customers ${f(rv.byPlan.CLIENT.gross)} · Vendors ${f(rv.byPlan.VENDOR.gross)} · UPI ${f(rv.byMethod.UPI.gross)} · Cash ${f(rv.byMethod.CASH.gross)}<br>${esc(rv.note)} <a href="${API}/admin/payments.csv">Download all payments (CSV)</a></p></div>
<h2>Payments to confirm (check your bank / UPI statement first)</h2><div class="card wrap">${pp.items.length?`<table><tr><th>Who</th><th>Plan</th><th>Amount</th><th>UPI reference</th><th></th></tr>${pp.items.map(x=>`<tr><td>${esc(x.user_name)}<br><a href="tel:${esc(x.user_phone)}">${esc(x.user_phone)}</a></td><td>${esc(x.plan)}</td><td><b>${f(x.amount)}</b></td><td>${esc(x.utr)}</td><td><button data-pc="${esc(x.ROWID)}">Confirm</button> <button class="bad" data-pj="${esc(x.ROWID)}">Reject</button></td></tr>`).join("")}</table>`:`<span class="mut">Nothing waiting.</span>`}</div>
<div class="card"><b>Record a cash / direct payment</b> <span class="mut">(the person must have signed in once)</span><br><input id="rp" placeholder="Mobile (10 digits)" inputmode="numeric"><select id="rl"><option>CLIENT</option><option>VENDOR</option></select><input id="ra" placeholder="Amount (blank = plan price)" size="22" inputmode="numeric"><input id="rn" placeholder="Note"><button id="radd">Record and start</button></div>
<h2>Follow up <select id="subf">${[["expiring","Ending soon"],["expired","Ended"],["locked","Vendors out of free customers"],["active","Active"],["all","All"]].map(o=>`<option value="${o[0]}" ${SUBF===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></h2><div class="card wrap">${sb.items.length?`<table><tr><th>Who</th><th>Plan</th><th>Valid until</th><th>Status</th><th></th></tr>${sb.items.map(x=>`<tr><td>${esc(x.name)}<br><a href="tel:${esc(x.phone)}">${esc(x.phone)}</a></td><td>${esc(x.plan)}${x.used?`<br><span class="mut">${esc(x.used)} used</span>`:""}</td><td>${esc(x.valid_until||"-")}</td><td>${esc(x.status)}${x.daysLeft?` (${esc(x.daysLeft)}d)`:""}</td><td><a class="btn" target="_blank" rel="noopener" href="${wa(x.phone,remind(x))}">WhatsApp reminder</a> <button class="alt" data-fu="${esc(x.user_id)}" data-pl="${esc(x.plan)}">Log follow-up</button></td></tr>`).join("")}</table>`:`<span class="mut">None here.</span>`}</div>
<h2>Open follow-ups</h2><div class="card wrap">${fu.items.length?`<table><tr><th>Who</th><th>Note</th><th>Due</th><th></th></tr>${fu.items.map(x=>`<tr><td>${esc(x.user_name)}<br><a href="tel:${esc(x.user_phone)}">${esc(x.user_phone)}</a></td><td>${esc(x.note)}</td><td style="${x.overdue?"color:var(--bad);font-weight:700":""}">${esc(x.due_date||"-")}${x.overdue?" (overdue)":""}</td><td><a class="btn" target="_blank" rel="noopener" href="${wa(x.user_phone,"Hello "+x.user_name+", following up from AAi Hyper.")}">WhatsApp</a> <button data-fd="${esc(x.ROWID)}">Done</button></td></tr>`).join("")}</table>`:`<span class="mut">No open follow-ups.</span>`}</div>
<h2>Prices and settings</h2><div class="card"><label>Customer pass ₹ <input id="s_pc" size="6" value="${esc(st.priceClient)}"></label> <label>days <input id="s_dc" size="4" value="${esc(st.daysClient)}"></label><br><label>Vendor plan ₹ <input id="s_pv" size="6" value="${esc(st.priceVendor)}"></label> <label>days <input id="s_dv" size="4" value="${esc(st.daysVendor)}"></label> <label>Free customers for vendors <input id="s_fs" size="4" value="${esc(st.freeSample)}"></label> <label>GST % <input id="s_gst" size="4" value="${esc(st.gstPct)}"></label><br><label>UPI ID <input id="s_upi" value="${esc(st.upiId)}" placeholder="name@bank"></label> <label>Name shown <input id="s_upn" value="${esc(st.upiName)}"></label><br>Customers must pay to see: ${["STORES","SELLERS","PROPERTY","DIRECTORY"].map(g=>`<label><input type="checkbox" id="g_${g}" ${st.gated.includes(g)?"checked":""}> ${g}</label>`).join(" ")}<br><button id="ssave">Save settings</button></div>`;
document.querySelectorAll("[data-pc]").forEach(b=>b.onclick=()=>act(()=>api("/admin/payments/"+b.dataset.pc+"/decision","POST",{confirm:true}),money));
document.querySelectorAll("[data-pj]").forEach(b=>b.onclick=()=>{const note=prompt("Why is it rejected? (shown to the person)","Reference not found in the statement");if(note!==null)act(()=>api("/admin/payments/"+b.dataset.pj+"/decision","POST",{confirm:false,note}),money)});
$("radd").onclick=()=>act(()=>api("/admin/payments","POST",{phone:$("rp").value,plan:$("rl").value,amount:$("ra").value,note:$("rn").value}),money);
$("subf").onchange=()=>{SUBF=$("subf").value;money()};
document.querySelectorAll("[data-fu]").forEach(b=>b.onclick=()=>{const note=prompt("Follow-up note (what you said / what was agreed):");if(!note)return;const due=prompt("Follow up again on (YYYY-MM-DD, optional):","")||"";act(()=>api("/admin/followups","POST",{userId:b.dataset.fu,plan:b.dataset.pl,note,dueDate:due}),money)});
document.querySelectorAll("[data-fd]").forEach(b=>b.onclick=()=>act(()=>api("/admin/followups/"+b.dataset.fd,"PATCH",{}),money));
$("ssave").onclick=()=>act(()=>api("/admin/settings","PUT",{priceClient:$("s_pc").value,daysClient:$("s_dc").value,priceVendor:$("s_pv").value,daysVendor:$("s_dv").value,freeSample:$("s_fs").value,gstPct:$("s_gst").value,upiId:$("s_upi").value,upiName:$("s_upn").value,gated:["STORES","SELLERS","PROPERTY","DIRECTORY"].filter(g=>$("g_"+g).checked)}).then(()=>alert("Saved")),money)}
async function boot(){try{U=await api("/me")}catch(e){loginCard();return}
$("who").textContent=(U.name||U.phone)+" · "+U.role;if(U.phone){$("out").hidden=false;$("out").onclick=async()=>{await api("/auth/logout","POST",{});location.reload()}}
if(!["VENDOR","ADMIN","WORKER","ARTIST","SELLER"].includes(U.role)){$("m").innerHTML=`<div class="card"><h1>No access</h1><p>Your number is not set up for the portal. Ask the admin to add it as a vendor.</p></div>`;return}
$("m").innerHTML=(U.role==="ADMIN"?`<div id="mon"></div><div id="adm"></div>`:`<div id="bill"></div>`)+(["VENDOR","ADMIN"].includes(U.role)?`<div id="ven"></div>`:"")+(["WORKER","ADMIN"].includes(U.role)?`<div id="svc"></div>`:"")+(["ARTIST","ADMIN"].includes(U.role)?`<div id="evt"></div>`:"")+(["SELLER","ADMIN"].includes(U.role)?`<div id="lds"></div>`:"");if(U.role==="ADMIN"){await money();await admin()}else await billing();if(["VENDOR","ADMIN"].includes(U.role))await vendor();if(["WORKER","ADMIN"].includes(U.role))await services();if(["ARTIST","ADMIN"].includes(U.role))await events();if(["SELLER","ADMIN"].includes(U.role))await leads()}
async function admin(){const [s,st,us,sl,pr,lw,di,at]=await Promise.all([api("/admin/summary"),api("/admin/stores"),api("/admin/users"),api("/admin/sellers"),api("/admin/properties?status="+PST),api("/admin/labour?verified="+LST),api("/admin/directory?status="+DST),api("/admin/attention")]);STORES=st.items;SELLERS=sl.items;const sn=Object.fromEntries(STORES.map(x=>[x.ROWID,x.name_en]));
const li=a=>a.length?a.map(esc).join(", "):"none";const A=at.toApprove;
$("adm").innerHTML=`<div class="card"><b>Needs attention</b> <span class="mut">(fixed rules, not AI)</span><p style="margin:6px 0">To confirm or approve: <b>${esc(A.payments)}</b> payments · <b>${esc(A.properties)}</b> properties · <b>${esc(A.businesses)}</b> businesses · <b>${esc(A.workers)}</b> workers to verify</p><p style="margin:6px 0">Waiting for a reply: <b>${esc(at.waiting.quotes)}</b> shop quotes · <b>${esc(at.waiting.sellerLeads)}</b> seller leads</p><p class="mut" style="margin:6px 0">Stores with no products: ${li(at.storesWithoutProducts)}<br>Sellers missing products or about text: ${li(at.sellersIncomplete)}<br>Businesses missing timings or about text: ${li(at.businessesIncomplete)}</p></div><h1>Admin: company and branches</h1><div class="kpis">${[["Stores",s.stores],["Orders",s.orders],["Quotes",s.quotes],["Users",s.users]].map(k=>`<div class="card kpi"><b>${esc(k[1])}</b>${k[0]}</div>`).join("")}</div>
<div class="card wrap"><table><tr><th>Store (branch)</th><th>Status</th><th>WhatsApp (10 digits)</th><th></th></tr>${STORES.map(x=>`<tr><td>${esc(x.name_en)}<br><span class="mut">id ${esc(x.ROWID)}</span></td><td>${esc(x.status)}</td>
<td><input data-w="${esc(x.ROWID)}" value="${esc((x.whatsapp||"").replace(/^91/,""))}" size="11" inputmode="numeric"></td>
<td><button data-save="${esc(x.ROWID)}">Save</button> <button class="alt" data-toggle="${esc(x.ROWID)}" data-st="${esc(x.status)}">${x.status==="ACTIVE"?"Pause":"Activate"}</button></td></tr>`).join("")}</table></div>
<div class="card"><b>Add store</b><br><input id="ns" placeholder="Store name"><input id="nt" placeholder="Tamil name"><input id="nf" placeholder="Delivery fee" inputmode="numeric" size="9"><input id="nm" placeholder="Min order" inputmode="numeric" size="9"><input id="ne" placeholder="ETA e.g. 30-45 min"><button id="nadd">Add store</button></div>
<h2>Worker verification <select id="lst" style="margin-left:8px"><option value="no" ${LST==="no"?"selected":""}>Waiting</option><option value="yes" ${LST==="yes"?"selected":""}>Verified</option></select></h2><div class="card wrap">${lw.items.length?`<table><tr><th>Worker</th><th>Trade</th><th>Place</th><th>Wage / experience</th><th></th></tr>${lw.items.map(x=>`<tr><td><b>${esc(x.name)}</b><br><a href="tel:${esc(x.phone)}">${esc(x.phone)}</a>${x.rating>0?"<br>"+esc(x.rating)+"★":""}</td><td>${esc(x.trade)}<br>${esc(x.level)}${x.team_size>1?"<br>team of "+esc(x.team_size):""}</td><td>${esc(x.district)}</td><td>₹${esc(x.daily_rate)}/day<br>${esc(x.experience_yrs)} yrs<br><span class="mut">${esc(x.languages)} ${esc(x.tools)}</span></td><td><button data-lv="${esc(x.ROWID)}" data-to="${x.verified==="yes"?"false":"true"}" class="${x.verified==="yes"?"alt":""}">${x.verified==="yes"?"Remove verification":"Verify (after checking ID by phone)"}</button></td></tr>`).join("")}</table>`:`<span class="mut">None.</span>`}</div>
<h2>Local business listings <select id="dst" style="margin-left:8px">${["PENDING","LIVE","HIDDEN","REJECTED"].map(x=>`<option ${DST===x?"selected":""}>${x}</option>`).join("")}</select></h2><div class="card wrap">${di.items.length?`<table><tr><th>Business</th><th>Owner</th><th>Details</th><th></th></tr>${di.items.map(x=>`<tr><td><b>${esc(x.name)}</b>${x.featured==="yes"?" ⭐":""}<br>${esc(x.category)}<br><span class="mut">${esc(x.locality)}, ${esc(x.district)}</span></td><td>${esc(x.owner_name)}<br><a href="tel:${esc(x.phone)}">${esc(x.phone)}</a></td><td><span class="mut">${esc(x.timings)}<br>${x.offer?"Offer: "+esc(x.offer)+"<br>":""}${esc(x.about)}${x.listed_until?"<br>Listed until "+esc(x.listed_until):""}${x.admin_note?"<br>Note: "+esc(x.admin_note):""}</span></td>
<td>${x.status!=="LIVE"?`<button data-da="${esc(x.ROWID)}">Approve (free first period)</button> `:`<button class="alt" data-df="${esc(x.ROWID)}" data-to="${x.featured==="yes"?"false":"true"}">${x.featured==="yes"?"Remove ⭐":"Make featured ⭐"}</button> <button class="alt" data-dh="${esc(x.ROWID)}">Hide</button> `}${x.status!=="REJECTED"?`<button class="bad" data-dr="${esc(x.ROWID)}">Reject</button>`:""}</td></tr>`).join("")}</table>`:`<span class="mut">No ${esc(DST.toLowerCase())} businesses.</span>`}</div>
<h2>Property listings <select id="pst" style="margin-left:8px">${["PENDING","LIVE","UNDER_NEGOTIATION","CLOSED","INACTIVE","REJECTED"].map(x=>`<option ${PST===x?"selected":""}>${x}</option>`).join("")}</select></h2><div class="card wrap">${pr.items.length?`<table><tr><th>Property</th><th>Owner</th><th>Details</th><th></th></tr>${pr.items.map(x=>`<tr><td><b>${esc(x.title)}</b><br>${esc(x.mode)} · ${esc(x.ptype)}<br><span class="mut">${esc(x.locality)}, ${esc(x.district)}</span><br><b>₹${esc(x.price)}</b>${x.mode==="RENT"?" / month":""}</td><td>${esc(x.owner_name)}${x.broker==="yes"?" (broker)":""}<br><a href="tel:${esc(x.owner_phone)}">${esc(x.owner_phone)}</a></td><td>${x.bhk>0?esc(x.bhk)+" BHK · ":""}${x.area_sqft>0?esc(x.area_sqft)+" sqft<br>":""}<span class="mut">${esc(x.approval_info)}<br>${esc(x.description)}${x.video_url?`<br><a href="${esc(x.video_url)}" target="_blank" rel="noopener">video</a>`:""}${x.admin_note?"<br>Note: "+esc(x.admin_note):""}</span></td>
<td>${x.status!=="LIVE"&&x.status!=="UNDER_NEGOTIATION"&&x.status!=="CLOSED"?`<button data-pa="${esc(x.ROWID)}">Approve</button> `:""}${x.status!=="REJECTED"?`<button class="bad" data-pr="${esc(x.ROWID)}">Reject</button>`:""}</td></tr>`).join("")}</table>`:`<span class="mut">No ${esc(PST.toLowerCase())} listings.</span>`}</div>
<h2>Seller directory</h2><div class="card wrap"><table><tr><th>Seller</th><th>Category</th><th>Status</th><th>Verified</th><th></th></tr>${SELLERS.map(x=>`<tr><td>${esc(x.name)}<br><span class="mut">/${esc(x.slug)} · ${esc(x.city)} ${esc(x.district)} · id ${esc(x.ROWID)}</span></td><td>${esc(x.category)}</td><td>${esc(x.status)}</td><td>${esc(x.verified)}</td><td><button class="alt" data-sv="${esc(x.ROWID)}" data-to="${x.status==="LIVE"?"HIDDEN":"LIVE"}">${x.status==="LIVE"?"Hide":"Show"}</button> <button class="alt" data-vf="${esc(x.ROWID)}" data-to="${x.verified==="yes"?"no":"yes"}">${x.verified==="yes"?"Remove badge":"Verify"}</button></td></tr>`).join("")||`<tr><td colspan="5" class="mut">No sellers yet.</td></tr>`}</table></div>

<div class="card"><b>Add team member by mobile number</b><br><input id="tp" placeholder="Mobile (10 digits)" inputmode="numeric"><input id="tn" placeholder="Name"><select id="tr"><option>VENDOR</option><option>WORKER</option><option>ARTIST</option><option>SELLER</option><option>ADMIN</option></select><select id="tk">${["PLUMBING","ELECTRICAL","CLEANING","APPLIANCE","PAINTING","CARPENTRY","OTHER"].concat(["NADASWARAM","SINGER","THAVIL","DJ_ORCHESTRA","CATERING","DECORATION","PHOTOGRAPHY","PANDIT","SOUND_LIGHT"]).map(c=>`<option>${c}</option>`).join("")}</select><select id="ts">${STORES.map(x=>`<option value="${esc(x.ROWID)}">${esc(x.name_en)}</option>`).join("")}</select><select id="tl">${SELLERS.map(x=>`<option value="${esc(x.ROWID)}">${esc(x.name)}</option>`).join("")}</select><button id="tadd">Add</button><p class="mut" style="margin:6px 0 0">A vendor needs a store; a worker or artist needs a trade / service; a seller needs a listing (pick the seller). They sign in with an OTP sent to this number.</p></div>`;

async function services(){const r=await api("/worker/requests");
$("svc").innerHTML=`<h2>Service requests${U.skill?" · "+esc(U.skill):""}</h2><div class="card wrap">${r.items.length?`<table><tr><th>Job</th><th>Customer</th><th>Status</th><th></th></tr>${r.items.map(x=>`<tr><td><b>${esc(x.category)}</b><br>${esc(x.description)}<br><span class="mut">${esc(x.preferred)}</span></td><td>${esc(x.customer_name)}${x.customer_phone?`<br><a href="tel:${esc(x.customer_phone)}">${esc(x.customer_phone)}</a><br>${esc(x.address)}`:`<br><span class="mut">Contact is shown after the customer accepts your quote</span>`}</td><td>${esc(x.status)}${x.quote_amount>0?`<br>₹${esc(x.quote_amount)}`:""}</td>
<td>${x.status==="NEW"&&U.role==="WORKER"?`<input data-qa="${esc(x.ROWID)}" placeholder="₹ amount" size="8" inputmode="numeric"><input data-qn="${esc(x.ROWID)}" placeholder="Note" size="14"><button data-q="${esc(x.ROWID)}">Send quote</button>`:""}${x.status==="ACCEPTED"?`<button data-d="${esc(x.ROWID)}">Mark done</button>`:""}</td></tr>`).join("")}</table>`:`<span class="mut">No requests yet.</span>`}</div>`;

async function events(){const r=await api("/artist/requests");const cal=U.role==="ARTIST"?(await api("/artist/calendar")).items:[];

${U.role==="ARTIST"?`<div class="card"><b>My calendar</b><p class="mut" style="margin:4px 0">${cal.length?cal.map(c=>`${esc(c.day)} (${c.kind==="BOOKED"?"booked":"blocked"})`).join(" · "):"No booked or blocked days."}</p><label>From <input id="bf" type="date"></label> <label>To <input id="bt" type="date"></label> <button id="bblock">Block days</button> <button class="alt" id="bunblock">Unblock</button></div>`:""}`;

async function leads(){const r=await api("/seller/leads");
$("lds").innerHTML=`<h2>Quote leads (customers who asked for a quote)</h2><div class="card wrap">${r.items.length?`<table><tr><th>Customer</th><th>Looking for</th><th>Status</th><th></th></tr>${r.items.map(x=>`<tr><td>${esc(x.customer_name)}<br>${x.locked?`<span class="mut">🔒</span> <button class="alt" data-ul="LEAD" data-id="${esc(x.ROWID)}">Unlock</button>`:`<a href="tel:${esc(x.customer_phone)}">${esc(x.customer_phone)}</a>`}${U.role==="ADMIN"?`<br><b>${esc(x.seller_name)}</b>`:""}</td><td>${esc(x.requirement)}<br><span class="mut">${esc(x.location)}${x.budget>0?" · budget ₹"+esc(x.budget):""}${x.product_name?" · "+esc(x.product_name):""}<br>valid until ${esc(x.valid_until)}</span></td><td>${esc(x.status)}</td>

${U.role==="SELLER"?`<div class="card"><b>Add a reference product</b><br><input id="lp" placeholder="Product name"><input id="ld" placeholder="Description"><input id="lr" placeholder="Reference price (0 = ask price)" size="14" inputmode="numeric"><button id="ladd">Add</button></div>`:""}`;

async function vendor(){const [o,q]=await Promise.all([api("/vendor/orders"),api("/vendor/quotes")]);const sn=Object.fromEntries(STORES.map(x=>[x.ROWID,x.name_en]));
