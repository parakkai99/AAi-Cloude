<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AAi Hyper | Local marketplace for your village</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@600;700&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f2;--card:#fff;--ink:#17261d;--mut:#5d6d63;--pri:#1f6b45;--onpri:#fff;--acc:#f2b705;--line:#dbe4dc;--soft:#e7f1ea;--warn:#fff3cd;--warnink:#6b4e00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1913;--card:#17231c;--ink:#e8f0ea;--mut:#9fb1a5;--pri:#4cc38a;--onpri:#08130d;--acc:#f2c230;--line:#2a3a30;--soft:#1d2e24;--warn:#3a3112;--warnink:#f5dc8a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1913;--card:#17231c;--ink:#e8f0ea;--mut:#9fb1a5;--pri:#4cc38a;--onpri:#08130d;--acc:#f2c230;--line:#2a3a30;--soft:#1d2e24;--warn:#3a3112;--warnink:#f5dc8a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans Tamil",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
h1,h2,h3{font-family:"Baloo Thambi 2","Noto Sans Tamil",system-ui,sans-serif;line-height:1.2;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px}
header .t{flex:1;min-width:0}header .t b{display:block;font-family:"Baloo Thambi 2",sans-serif;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header .t small{color:var(--mut)}
.lang{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 14px;font-weight:600;min-height:40px}
main{max-width:1100px;margin:0 auto;padding:16px 16px 96px}
nav{position:fixed;left:0;right:0;bottom:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
nav button{flex:1;background:none;border:0;padding:10px 4px 8px;min-height:56px;color:var(--mut);font-size:13px;position:relative}
nav button.on{color:var(--pri);font-weight:600}nav button .n{position:absolute;top:4px;left:55%;background:var(--acc);color:#241a00;border-radius:999px;font-size:11px;padding:0 6px;font-weight:700}
.notebook{display:block;width:100%;text-align:left;border:2px solid var(--pri);border-radius:14px;padding:18px 18px 18px 52px;color:var(--ink);background:repeating-linear-gradient(transparent 0 27px,var(--line) 27px 28px),var(--card);background-position:0 8px;position:relative}
.notebook::before{content:"";position:absolute;left:36px;top:0;bottom:0;width:2px;background:#d9534f55}
.notebook h2{font-size:22px;color:var(--pri)}.notebook p{margin:4px 0 0;color:var(--mut)}
.sec{margin:26px 0 10px;font-size:19px}.hero{background:linear-gradient(135deg,var(--pri),#0f4a2e);color:var(--onpri);border-radius:18px;padding:28px 22px;margin-bottom:16px}.hero h1{font-size:clamp(26px,5vw,42px)}.hero p{max-width:560px;margin:8px 0 0;opacity:.92}.sg{display:grid;gap:10px}.sg .store{margin:0}@media(min-width:760px){.sg{grid-template-columns:repeat(3,1fr)}.tiles{grid-template-columns:repeat(7,1fr)}.hero{padding:44px 36px}.notebook{max-width:560px}}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 2px;text-align:center;font-size:12.5px;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tile span{font-size:24px}.tile.on{border-color:var(--pri);background:var(--soft);font-weight:600}.tile:disabled{opacity:.6}.tile small{color:var(--mut);font-size:10.5px}
.store{display:flex;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;align-items:center}
.ico{width:48px;height:48px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:26px;flex:none}
.store b{display:block}.store small{color:var(--mut)}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.row .g{flex:1;min-width:0}.row small{color:var(--mut);display:block}
.row.low{background:var(--warn);margin:0 -10px;padding:12px 10px;border-radius:8px}
.q{display:flex;align-items:center;gap:6px}.q button{width:40px;height:40px;border-radius:50%;border:1px solid var(--pri);background:var(--card);color:var(--pri);font-size:20px;font-weight:700;line-height:1}
.q span{min-width:26px;text-align:center;font-weight:600}
.btn{display:block;width:100%;min-height:50px;border:0;border-radius:12px;background:var(--pri);color:var(--onpri);font-weight:600;font-size:17px;padding:12px;margin-top:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.back{background:none;border:0;color:var(--pri);font-weight:600;padding:4px 0 12px;min-height:44px}
.note{background:var(--warn);color:var(--warnink);border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
select,input[type=text],input[type=tel]{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card);color:var(--ink);font:inherit}
label.opt{display:flex;gap:10px;align-items:center;min-height:44px}
.steps{display:flex;gap:4px;margin-top:10px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.d{background:var(--pri)}
.total{display:flex;justify-content:space-between;padding:4px 0}.total.b{font-weight:700;font-size:18px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.preview{width:100%;max-height:220px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.cartbar{position:fixed;left:16px;right:16px;bottom:calc(68px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;background:var(--pri);color:var(--onpri);border:0;border-radius:14px;min-height:52px;font-weight:600;font-size:16px;z-index:8;box-shadow:0 6px 20px #0004}.btn.wa{background:#1f9d57;color:#fff}.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:20;text-align:center}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>

else if(a==="place"){if(S.live&&!S.user){say(t("needLogin"));return}if(S.name.trim().length<2){say(t("needName"));return}if(!S.addr.trim()){say(t("needAddr"));return}if(!S.busy){S.busy=true;render();placeAll()}}
else if(a==="quote"){if(S.live&&!S.user){say(t("needLogin"));return}if(S.name.trim().length<2){say(t("needName"));return}const g=groups(),first=Object.keys(g)[0],st=STORES.find(x=>x.id==first),m=msg();
if(S.live)api("/quotes",{name:S.name,storeId:first,address:S.addr,text:m.slice(0,250),items:g[first].map(([p,q])=>({productId:p.id,qty:q}))}).catch(()=>{});
window.open("https://wa.me/"+((st&&st.wa)||WA)+"?text="+encodeURIComponent(m),"_blank","noopener");say(t("quoteSent"))}});
const ph10=()=>S.phone.replace(/\D/g,"").slice(-10);
function msg(){const g=groups();let m="AAi Hyper - "+t("quoteHead")+"\n",sub=0;for(const sid in g){const s=STORES.find(x=>x.id==sid);m+="\n"+nm(s)+":\n";g[sid].forEach(([p,q])=>{sub+=p.p*q;m+="• "+nm(p)+" × "+q+" ("+p.u+")\n"})}return m+"\n"+t("est")+": ₹"+sub+"\n"+S.name+" "+(S.user&&S.user.phone||ph10())+"\n"+S.addr}
async function api(path,body,method){const r=await fetch(API+path,{method:method||(body?"POST":"GET"),credentials:"same-origin",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error((j.error&&j.error.message)||"Error");e.status=r.status;e.billing=j.billing;throw e}return j}
async function sendOtp(){if(!/^[6-9]\d{9}$/.test(ph10())){say(t("needPhone"));return}try{await api("/auth/otp/send",{phone:ph10()});S.auth.sent=true;render();say(t("codeSent"))}catch(e){say(e.message)}}
async function verifyOtp(){try{const r=await api("/auth/otp/verify",{phone:ph10(),code:S.code,name:S.name});S.user=r.user;if(r.user.name&&!S.name)S.name=r.user.name;S.auth={sent:false};S.code="";save();await loadStores();await loadBilling();await refreshOrders();await refreshSvc();await refreshEv();await loadLeads();await loadMine();await loadLabour();render()}catch(e){say(e.message)}}
async function loadDir(){try{const q=new URLSearchParams();if(S.dc)q.set("category",S.dc);if(S.dd.trim())q.set("district",S.dd.trim());S.dlist=(await api("/directory?"+q)).items;S.gates.DIRECTORY=null}catch(e){S.dlist=[];S.gates.DIRECTORY=gateOf(e)}if(S.view==="dir"&&S.dtab==="browse")render()}
async function loadDirMine(){if(!S.live||!S.user){render();return}try{S.dmine=await api("/directory/mine")}catch(e){}if(S.view==="dir")render()}
async function loadLabour(){if(!S.live||!S.user){render();return}const g=async p=>{try{return await api(p)}catch(e){return null}};
const [pr,jb,ap,mi]=await Promise.all([g("/labour/profile"),g("/labour/jobs"),g("/labour/applications/mine"),g("/labour/jobs/mine")]);
S.lp=pr&&pr.profile;if(S.lp&&!S.ledit)Object.assign(S.lf,{trade:S.lp.trade,level:S.lp.level,district:S.lp.district,dailyRate:S.lp.daily_rate,experienceYrs:S.lp.experience_yrs,teamSize:S.lp.team_size,languages:S.lp.languages||"",tools:S.lp.tools||""});
S.ljobs=jb?jb.items:[];S.lapps=ap?ap.items:[];S.lmine=mi?mi.items:[];S.lnotice=(jb&&jb.notice)||(mi&&mi.notice)||S.lnotice;if(S.view==="labour")render()}
async function lrefresh(){await loadLabour();if(S.lopen){try{S.lapl=(await api("/labour/jobs/"+S.lopen+"/applicants")).items}catch(e){S.lapl=[]}}if(S.view==="labour")render()}
async function loadProps(){try{const q=new URLSearchParams({mode:S.pm});if(S.pt)q.set("ptype",S.pt);if(S.pd.trim())q.set("district",S.pd.trim());if(S.pmax)q.set("maxPrice",S.pmax);S.props=(await api("/properties?"+q)).items;S.gates.PROPERTY=null}catch(e){S.props=[];S.gates.PROPERTY=gateOf(e)}if(S.view==="property"&&S.ptab==="browse"&&!S.pp)render()}
async function loadMine(){if(!S.live||!S.user){render();return}try{const [a,b,c]=await Promise.all([api("/properties/mine"),api("/properties/enquiries/inbox"),api("/properties/enquiries/mine")]);S.mine=a.items;S.inbox=b.items;S.penq=c.items}catch(e){}if(S.view==="property")render()}
async function loadSellers(){try{S.sellers=(await api("/sellers"+(S.sc?"?category="+S.sc:""))).items;S.gates.SELLERS=null}catch(e){S.gates.SELLERS=gateOf(e);S.sellers=[]}if(S.view==="sellers"&&!S.sp)render();loadLeads()}
async function loadLeads(){if(!S.live||!S.user){render();return}try{S.sleads=(await api("/sellers/leads/mine")).items}catch(e){}if(S.view==="sellers")render()}
async function refreshEv(){if(!S.live||!S.user)return;try{S.evs=(await api("/events/mine")).items;if(S.view==="services"&&S.svcMode==="event")render()}catch(e){}}
async function refreshSvc(){if(!S.live||!S.user)return;try{S.svc=(await api("/services/mine")).items;if(S.view==="services")render()}catch(e){}}
async function refreshOrders(){if(!S.live||!S.user)return;try{S.orders=(await api("/orders/mine")).items.map(o=>({id:o.ROWID,s:String(o.store_id),tot:+o.total,status:o.status,slot:o.slot,lines:o.lines||[]}));if(S.view==="orders")render()}catch(e){}}
async function placeAll(){const g=groups();try{for(const sid in g){const st=STORES.find(x=>x.id==sid),items=g[sid].map(([p,q])=>[p.id,q]),sub=g[sid].reduce((a,[p,q])=>a+p.p*q,0);
if(S.live)await api("/orders",{storeId:sid,items:items.map(([productId,qty])=>({productId,qty})),name:S.name,address:S.addr,slot:TXT.en.slots[S.slot]});
else S.orders.unshift({id:Math.floor(1000+Math.random()*9000),s:sid,items,tot:sub+st.fee,slot:+S.slot,st:0});
g[sid].forEach(([p])=>delete S.cart[p.id])}
S.view="orders";S.busy=false;save();await refreshOrders();render();say(t("placed"))}catch(e){S.busy=false;save();render();say(e.message)}}
document.addEventListener("change",e=>{const el=e.target;
if(el.id==="file"&&el.files[0]){S.draft.img=URL.createObjectURL(el.files[0]);S.draft.data=null;S.draft.msg="";shrink(el.files[0],u=>{S.draft.data=u;if(!u)S.draft.msg=S.lang==="ta"?"படத்தைத் திறக்க முடியவில்லை.":"Could not open this photo.";render()});render()}
else if(el.dataset.a==="consent"){S.draft.ok=el.checked;render()}
else if(el.dataset.in==="slot")S.slot=+el.value;else if(el.dataset.in==="svcCat")S.svcCat=el.value;else if((el.dataset.in||"").startsWith("ev."))S.ev[el.dataset.in.slice(3)]=el.value;else if(el.dataset.in==="ld.consent")S.ld.consent=el.checked;else if(el.dataset.in==="pf.broker")S.pf.broker=el.checked;else if(el.dataset.in==="pe.consent")S.pe.consent=el.checked;else if((el.dataset.in||"").startsWith("pf.")){S.pf[el.dataset.in.slice(3)]=el.value;if(el.dataset.in==="pf.mode")render()}else if((el.dataset.in||"").startsWith("lf.")||(el.dataset.in||"").startsWith("lj.")){const d=el.dataset.in;(d[1]==="f"?S.lf:S.lj)[d.slice(3)]=el.value}else if((el.dataset.in||"").startsWith("df."))S.df[el.dataset.in.slice(3)]=el.value;else if(el.dataset.in==="dc")S.dc=el.value;else if(el.dataset.in==="pt")S.pt=el.value;else if(el.dataset.in==="ld.route")S.ld.route=el.value;else if(el.dataset.in==="sc"){S.sc=el.value;loadSellers()}});
document.addEventListener("input",e=>{const k=e.target.dataset.in;if(k==="addr"||k==="name"||k==="phone"||k==="code"||k==="svcDesc"||k==="utr"){S[k]=e.target.value;save()}else if(k&&k.startsWith("ev.")){S.ev[k.slice(3)]=e.target.value}else if(k&&k.startsWith("ld.")&&k!=="ld.consent"&&k!=="ld.route"){S.ld[k.slice(3)]=e.target.value}else if(k&&((k.startsWith("pf.")&&k!=="pf.broker")||(k.startsWith("pe.")&&k!=="pe.consent"))){(k[1]==="f"?S.pf:S.pe)[k.slice(3)]=e.target.value}else if(k==="pd"||k==="pmax"){S[k]=e.target.value}else if(k&&k.startsWith("df.")){S.df[k.slice(3)]=e.target.value}else if(k==="dd"){S.dd=e.target.value}else if(k==="ltext"&&S.draft){S.draft.text=e.target.value;const bt=document.querySelector("[data-a=readtext]");if(bt)bt.disabled=S.draft.text.trim().length<3}else if(k&&(k.startsWith("lf.")||k.startsWith("lj."))){(k[1]==="f"?S.lf:S.lj)[k.slice(3)]=e.target.value}});
setInterval(()=>{let ch=false;if(!S.live)S.orders.forEach(o=>{if(o.st<4){o.st++;ch=true}});if(ch){save();if(S.view==="orders")render()}},9000);
setInterval(()=>{refreshOrders();if(S.view==="services")S.svcMode==="event"?refreshEv():refreshSvc()},15000);
const gateOf=e=>e&&(e.status===401||e.status===402)?{status:e.status,message:e.message}:null;
async function loadStores(){const SS=[],PP=[];try{const st=(await api("/stores")).items;S.gates.STORES=null;
for(const x of st){const id=String(x.ROWID);SS.push({id,i:/milk|dairy/i.test(x.name_en)?"🥛":/veg|fruit/i.test(x.name_en)?"🥬":"🛒",en:x.name_en,ta:x.name_ta||x.name_en,fee:+x.delivery_fee,min:+x.min_order,eta:x.eta||"",wa:x.whatsapp||""});
(await api("/stores/"+id+"/products")).items.forEach(q=>PP.push({id:String(q.ROWID),s:id,en:q.name_en,ta:q.name_ta||q.name_en,u:q.unit,p:+q.price}))}}catch(e){S.gates.STORES=gateOf(e)}
STORES.splice(0,STORES.length,...SS);P.splice(0,P.length,...PP);S.cart=Object.fromEntries(Object.entries(S.cart).filter(([k])=>byId(k)))}
async function loadBilling(){if(!S.live||!S.user){S.bm=null;return}try{S.bm=await api("/billing/me");S.bill=S.bm.billing}catch(e){}}
async function loadCatalog(){try{S.bill=await api("/billing/info")}catch(e){return}
S.live=true;S.orders=[];try{S.user=await api("/me");if(S.user.name&&!S.name)S.name=S.user.name}catch(e){}
await loadStores();await loadBilling();await refreshOrders();render()}
render();loadCatalog();
</script>
</body>
</html>
