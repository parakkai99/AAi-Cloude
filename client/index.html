<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AAi Hyper | Local marketplace for your village</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@600;700&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f2;--card:#fff;--ink:#17261d;--mut:#5d6d63;--pri:#1f6b45;--onpri:#fff;--acc:#f2b705;--line:#dbe4dc;--soft:#e7f1ea;--warn:#fff3cd;--warnink:#6b4e00;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1913;--card:#17231c;--ink:#e8f0ea;--mut:#9fb1a5;--pri:#4cc38a;--onpri:#08130d;--acc:#f2c230;--line:#2a3a30;--soft:#1d2e24;--warn:#3a3112;--warnink:#f5dc8a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1913;--card:#17231c;--ink:#e8f0ea;--mut:#9fb1a5;--pri:#4cc38a;--onpri:#08130d;--acc:#f2c230;--line:#2a3a30;--soft:#1d2e24;--warn:#3a3112;--warnink:#f5dc8a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans Tamil",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
h1,h2,h3{font-family:"Baloo Thambi 2","Noto Sans Tamil",system-ui,sans-serif;line-height:1.2;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px}
header .t{flex:1;min-width:0}header .t b{display:block;font-family:"Baloo Thambi 2",sans-serif;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header .t small{color:var(--mut)}
.lang{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:6px 14px;font-weight:600;min-height:40px}
main{max-width:1100px;margin:0 auto;padding:16px 16px 96px}
nav{position:fixed;left:0;right:0;bottom:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
nav button{flex:1;background:none;border:0;padding:10px 4px 8px;min-height:56px;color:var(--mut);font-size:13px;position:relative}
nav button.on{color:var(--pri);font-weight:600}nav button .n{position:absolute;top:4px;left:55%;background:var(--acc);color:#241a00;border-radius:999px;font-size:11px;padding:0 6px;font-weight:700}
.notebook{display:block;width:100%;text-align:left;border:2px solid var(--pri);border-radius:14px;padding:18px 18px 18px 52px;color:var(--ink);background:repeating-linear-gradient(transparent 0 27px,var(--line) 27px 28px),var(--card);background-position:0 8px;position:relative}
.notebook::before{content:"";position:absolute;left:36px;top:0;bottom:0;width:2px;background:#d9534f55}
.notebook h2{font-size:22px;color:var(--pri)}.notebook p{margin:4px 0 0;color:var(--mut)}
.sec{margin:26px 0 10px;font-size:19px}.hero{background:linear-gradient(135deg,var(--pri),#0f4a2e);color:var(--onpri);border-radius:18px;padding:28px 22px;margin-bottom:16px}.hero h1{font-size:clamp(26px,5vw,42px)}.hero p{max-width:560px;margin:8px 0 0;opacity:.92}.sg{display:grid;gap:10px}.sg .store{margin:0}@media(min-width:760px){.sg{grid-template-columns:repeat(3,1fr)}.tiles{grid-template-columns:repeat(7,1fr)}.hero{padding:44px 36px}.notebook{max-width:560px}}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 2px;text-align:center;font-size:12.5px;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tile span{font-size:24px}.tile.on{border-color:var(--pri);background:var(--soft);font-weight:600}.tile:disabled{opacity:.6}.tile small{color:var(--mut);font-size:10.5px}
.store{display:flex;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;align-items:center}
.ico{width:48px;height:48px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-size:26px;flex:none}
.store b{display:block}.store small{color:var(--mut)}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.row .g{flex:1;min-width:0}.row small{color:var(--mut);display:block}
.row.low{background:var(--warn);margin:0 -10px;padding:12px 10px;border-radius:8px}
.q{display:flex;align-items:center;gap:6px}.q button{width:40px;height:40px;border-radius:50%;border:1px solid var(--pri);background:var(--card);color:var(--pri);font-size:20px;font-weight:700;line-height:1}
.q span{min-width:26px;text-align:center;font-weight:600}
.btn{display:block;width:100%;min-height:50px;border:0;border-radius:12px;background:var(--pri);color:var(--onpri);font-weight:600;font-size:17px;padding:12px;margin-top:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.back{background:none;border:0;color:var(--pri);font-weight:600;padding:4px 0 12px;min-height:44px}
.note{background:var(--warn);color:var(--warnink);border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
select,input[type=text],input[type=tel]{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card);color:var(--ink);font:inherit}
label.opt{display:flex;gap:10px;align-items:center;min-height:44px}
.steps{display:flex;gap:4px;margin-top:10px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.d{background:var(--pri)}
.total{display:flex;justify-content:space-between;padding:4px 0}.total.b{font-weight:700;font-size:18px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.preview{width:100%;max-height:220px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.cartbar{position:fixed;left:16px;right:16px;bottom:calc(68px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;background:var(--pri);color:var(--onpri);border:0;border-radius:14px;min-height:52px;font-weight:600;font-size:16px;z-index:8;box-shadow:0 6px 20px #0004}.btn.wa{background:#1f9d57;color:#fff}.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;z-index:20;text-align:center}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>

ta:{market:"AAi Hyper",area:"உள்ளூர் மளிகை, வீடு தேடி",heroH:"உங்கள் ஊர் சந்தை, உங்கள் கையில்",heroP:"தெரிந்த கடைகளில் மளிகை, பால், காய்கறி ஆர்டர் செய்யுங்கள். கையால் எழுதிய பட்டியலைப் படம் எடுத்தால் ஆர்டராக மாற்றுவோம்.",home:"முகப்பு",list:"பட்டியல் படம்",cart:"கார்ட்",orders:"ஆர்டர்கள்",

slots:["இன்று மாலை 5-7","நாளை காலை 7-9","நாளை மாலை 5-7"],per:"/",name:"உங்கள் பெயர்",phone:"மொபைல் எண்",quote:"வாட்ஸ்அப்பில் விலை கேள்",quoteNote:"விலை அல்லது இருப்பு தெரியவில்லையா? பட்டியலை வாட்ஸ்அப்பில் அனுப்புங்கள், கடை விலை சொல்லும்.",quoteHead:"விலை கேட்பு",est:"மதிப்பீடு",needContact:"பெயர் மற்றும் 10 இலக்க மொபைல் எண்ணை உள்ளிடுங்கள்.",quoteSent:"வாட்ஸ்அப் திறக்கிறது…",viewCart:"கார்ட் பார்",rej:"கடை நிராகரித்தது"}};
const STORES=[{id:"1",i:"🛒",en:"Murugan Provision Store",ta:"முருகன் மளிகை",fee:20,min:150,eta:"30-45 min"},
{id:"2",i:"🥬",en:"Amman Vegetables",ta:"அம்மன் காய்கறி",fee:20,min:100,eta:"30-45 min"},
{id:"3",i:"🥛",en:"Kovai Milk and Dairy",ta:"கோவை பால் கடை",fee:10,min:60,eta:"20-30 min"}];
const P=[[1,1,"Rice","அரிசி","kg",62],[2,1,"Toor dal","துவரம் பருப்பு","kg",165],[3,1,"Sugar","சர்க்கரை","kg",46],[4,1,"Coconut oil","தேங்காய் எண்ணெய்","L",210],[5,1,"Tea powder","தேயிலை","250 g",95],[6,1,"Salt","உப்பு","kg",22],
[7,2,"Tomato","தக்காளி","kg",30],[8,2,"Onion","வெங்காயம்","kg",38],[9,2,"Banana","வாழைப்பழம்","dozen",60],[10,3,"Milk","பால்","500 ml",30],[11,3,"Curd","தயிர்","500 g",35],[12,3,"Eggs","முட்டை","6 pcs",42]]
.map(a=>({id:String(a[0]),s:String(a[1]),en:a[2],ta:a[3],u:a[4],p:a[5]}));
const byId=id=>P.find(x=>x.id===id);
const API="/server/aai_api";const WA="";/* set support WhatsApp as 91XXXXXXXXXX; each store can also have its own number */
const S={lang:"en",view:"home",store:null,cart:{},orders:[],draft:null,slot:0,pay:"cod",addr:"",name:"",phone:"",toast:"",live:false,busy:false};
try{const s=JSON.parse(localStorage.getItem("hm_v1")||"null");if(s){S.lang=s.lang||"en";S.cart=s.cart||{};S.orders=s.orders||[];S.addr=s.addr||"";S.name=s.name||"";S.phone=s.phone||""}}catch(e){}
const save=()=>{try{localStorage.setItem("hm_v1",JSON.stringify({lang:S.lang,cart:S.cart,orders:S.orders,addr:S.addr,name:S.name,phone:S.phone}))}catch(e){}};
const t=k=>TXT[S.lang][k]??TXT.en[k]??k, nm=o=>S.lang==="ta"?o.ta:o.en;
const cnt=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function qty(id,n){const c=(S.cart[id]||0)+n;if(c<=0)delete S.cart[id];else S.cart[id]=c;save();render()}
const qctl=id=>`<div class="q"><button data-a="dec" data-id="${id}" aria-label="−">−</button><span>${S.cart[id]||0}</span><button data-a="inc" data-id="${id}" aria-label="+">+</button></div>`;
function home(){return `<section class="hero"><h1>${t("heroH")}</h1><p>${t("heroP")}</p></section><button class="notebook" data-a="go" data-v="list"><h2>${t("listH")}</h2><p>${t("listP")}</p></button>
<h2 class="sec">${t("cat")}</h2><div class="tiles">
<button class="tile on" data-a="go" data-v="home"><span>🛒</span>${t("ess")}</button>
${[["🔧","svc"],["🪔","evt"],["🏠","prop"],["📺","sell"],["👷","wrk"],["🏪","dir"]].map(x=>`<button class="tile" disabled><span>${x[0]}</span>${t(x[1])}<small>${t("soon")}</small></button>`).join("")}</div>
<h2 class="sec">${t("stores")}</h2><div class="sg">${STORES.map(s=>`<button class="store" data-a="store" data-id="${s.id}"><div class="ico">${s.i}</div><div><b>${nm(s)}</b><small>${s.eta} · ₹${s.min} ${t("min")}</small></div></button>`).join("")}</div>`}
function storeV(){const s=STORES.find(x=>x.id===S.store);return `<button class="back" data-a="go" data-v="home">‹ ${t("back")}</button><h2>${nm(s)}</h2><small style="color:var(--mut)">${s.eta} · ₹${s.fee}</small>
${P.filter(p=>p.s===s.id).map(p=>`<div class="row"><div class="g"><b>${nm(p)}</b><small>₹${p.p} ${t("per")} ${p.u}</small></div>${qctl(p.id)}</div>`).join("")}${cnt()?`<button class="cartbar" data-a="go" data-v="cart">🧺 ${cnt()} · ${t("viewCart")}</button>`:""}`}
const DEMO=[["Rice",5,.94],["Toor dal",1,.61],["Sugar",2,.88],["Onion",2,.72],["Milk",2,.9]];
function listV(){const d=S.draft||(S.draft={img:null,ok:false,items:null,busy:false});
let h=`<h2>${t("listH")}</h2><p style="color:var(--mut)">${t("listP")}</p>`;
if(!d.items){h+=`<div class="card">${d.img?`<img class="preview" src="${d.img}" alt="">`:""}<input id="file" type="file" accept="image/*" capture="environment" hidden>
<button class="btn alt" data-a="pick" style="margin-top:0">📷 ${t("choose")}</button>
<label class="opt"><input type="checkbox" data-a="consent" ${d.ok?"checked":""}> <span>${t("consent")}</span></label>
<button class="btn" data-a="read" ${d.img&&d.ok&&!d.busy?"":"disabled"}>${d.busy?t("reading"):t("read")}</button></div>`}
else{h+=`<div class="note">${t("demo")}</div><h3 class="sec" style="margin-top:8px">${t("check")}</h3>${d.items.map((it,i)=>{const p=byId(it.id);return `<div class="row ${it.c<.8?"low":""}"><div class="g"><b>${nm(p)}</b><small>${it.c<.8?"⚠ "+t("lowc")+" ("+Math.round(it.c*100)+"%)":Math.round(it.c*100)+"%"} · ₹${p.p} ${t("per")} ${p.u}</small></div>
<div class="q"><button data-a="ditem" data-i="${i}" data-n="-1">−</button><span>${it.q}</span><button data-a="ditem" data-i="${i}" data-n="1">+</button></div></div>`}).join("")}
<button class="btn" data-a="dconfirm" ${d.items.length?"":"disabled"}>${t("confirm")}</button>`}
return h}
function groups(){const g={};for(const id in S.cart){const p=byId(id);(g[p.s]=g[p.s]||[]).push([p,S.cart[id]])}return g}
function cartV(){if(!cnt())return `<div class="empty">🧺<p>${t("nothing")}</p></div>`;const g=groups();let sub=0,fee=0,h=`<h2>${t("cart")}</h2>`;
for(const sid in g){const s=STORES.find(x=>x.id==sid);h+=`<div class="card"><b>${nm(s)}</b>${g[sid].map(([p,q])=>{sub+=p.p*q;return `<div class="row"><div class="g">${nm(p)}<small>₹${p.p} × ${q}</small></div>${qctl(p.id)}</div>`}).join("")}</div>`;fee+=s.fee}
h+=`<div class="card"><label for="nm"><b>${t("name")}</b></label><input id="nm" type="text" data-in="name" value="${esc(S.name)}" autocomplete="name" style="margin:6px 0 12px"><label for="ph"><b>${t("phone")}</b></label><input id="ph" type="tel" inputmode="numeric" data-in="phone" value="${esc(S.phone)}" placeholder="98XXXXXXXX" autocomplete="tel" style="margin:6px 0 12px"><label for="addr"><b>${t("addr")}</b></label><input id="addr" type="text" data-in="addr" value="${esc(S.addr)}" placeholder="${t("addrPh")}" style="margin:6px 0 12px">
<label for="slot"><b>${t("slot")}</b></label><select id="slot" data-in="slot" style="margin:6px 0 12px">${t("slots").map((x,i)=>`<option value="${i}" ${S.slot==i?"selected":""}>${x}</option>`).join("")}</select>
<b>${t("pay")}</b>${["cod","upi"].map(k=>`<label class="opt"><input type="radio" name="pay" data-in="pay" value="${k}" ${S.pay==k?"checked":""}> ${t(k)}</label>`).join("")}</div>
<div class="card"><div class="total"><span>${t("sub")}</span><span>₹${sub}</span></div><div class="total"><span>${t("fee")}</span><span>₹${fee}</span></div><div class="total b"><span>${t("tot")}</span><span>₹${sub+fee}</span></div></div>
<button class="btn" data-a="place" ${S.busy?"disabled":""}>${t("place")}</button><button class="btn wa" data-a="quote">💬 ${t("quote")}</button><p style="color:var(--mut);font-size:14px">${t("quoteNote")}</p>`;return h}
function ordersV(){if(!S.orders.length)return `<div class="empty">📦<p>${t("noOrd")}</p></div>`;
return `<h2>${t("orders")}</h2>`+S.orders.map(o=>{const s=STORES.find(x=>x.id==o.s)||STORES[0];return `<div class="card"><div class="total"><b>${nm(s)}</b><b>₹${o.tot}</b></div><small style="color:var(--mut)">#${o.id} · ${t("slots")[o.slot]} · ${t(o.pay)}</small>
<p style="margin:8px 0 0"><b>${o.rej?t("rej"):t("st")[o.st]}</b></p><div class="steps">${t("st").map((_,i)=>`<i class="${i<=o.st?"d":""}"></i>`).join("")}</div>
<small style="color:var(--mut)">${o.items.map(x=>nm(byId(x[0]))+" × "+x[1]).join(", ")}</small></div>`}).join("")}
function render(){const V={home,store:storeV,list:listV,cart:cartV,orders:ordersV}[S.view]();document.documentElement.lang=S.lang==="ta"?"ta":"en";
const nb=(v,i,l)=>`<button data-a="go" data-v="${v}" class="${S.view===v||(v==="home"&&S.view==="store")?"on":""}" aria-label="${l}"><div style="font-size:22px">${i}</div>${l}${v==="cart"&&cnt()?`<span class="n">${cnt()}</span>`:""}</button>`;
document.getElementById("app").innerHTML=`<header><div class="t"><b>${t("market")}</b><small>${t("area")}</small></div><button class="lang" data-a="lang">${S.lang==="en"?"தமிழ்":"English"}</button></header>
<main>${V}</main><nav>${nb("home","🏠",t("home"))}${nb("list","📝",t("list"))}${nb("cart","🧺",t("cart"))}${nb("orders","📦",t("orders"))}</nav>${S.toast?`<div class="toast" role="status">${S.toast}</div>`:""}`}
function say(m){S.toast=m;render();setTimeout(()=>{S.toast="";render()},2600)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id;
if(a==="go"){S.view=b.dataset.v;render();scrollTo(0,0)}
else if(a==="lang"){S.lang=S.lang==="en"?"ta":"en";save();render()}
else if(a==="store"){S.store=id;S.view="store";render();scrollTo(0,0)}
else if(a==="inc")qty(id,1);else if(a==="dec")qty(id,-1);
else if(a==="pick")document.getElementById("file").click();
else if(a==="read"){S.draft.busy=true;render();setTimeout(()=>{S.draft.busy=false;S.draft.items=DEMO.map(d=>{const p=P.find(x=>x.en===d[0]);return p&&{id:p.id,q:d[1],c:d[2]}}).filter(Boolean);render()},1100)}
else if(a==="ditem"){const it=S.draft.items[+b.dataset.i];it.q+=+b.dataset.n;if(it.q<=0)S.draft.items.splice(+b.dataset.i,1);render()}
else if(a==="dconfirm"){S.draft.items.forEach(it=>S.cart[it.id]=(S.cart[it.id]||0)+it.q);S.draft=null;save();S.view="cart";render()}
else if(a==="place"){if(!okContact()){say(t("needContact"));return}if(!S.addr.trim()){say(t("needAddr"));return}if(!S.busy){S.busy=true;render();placeAll()}}
else if(a==="quote"){if(!okContact()){say(t("needContact"));return}const g=groups(),first=Object.keys(g)[0],st=STORES.find(x=>x.id==first),m=msg();
if(S.live)api("/quotes",{name:S.name,phone:S.phone,storeId:first,address:S.addr,text:m.slice(0,250),items:g[first].map(([p,q])=>({productId:p.id,qty:q}))}).catch(()=>{});
window.open("https://wa.me/"+((st&&st.wa)||WA)+"?text="+encodeURIComponent(m),"_blank","noopener");say(t("quoteSent"))}});
const ph10=()=>S.phone.replace(/\D/g,"").slice(-10);
const okContact=()=>S.name.trim().length>=2&&/^[6-9]\d{9}$/.test(ph10());
function msg(){const g=groups();let m="AAi Hyper - "+t("quoteHead")+"\n",sub=0;for(const sid in g){const s=STORES.find(x=>x.id==sid);m+="\n"+nm(s)+":\n";g[sid].forEach(([p,q])=>{sub+=p.p*q;m+="• "+nm(p)+" × "+q+" ("+p.u+")\n"})}return m+"\n"+t("est")+": ₹"+sub+"\n"+S.name+" "+ph10()+"\n"+S.addr}
async function api(path,body){const r=await fetch(API+path,{method:body?"POST":"GET",headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.error&&j.error.message)||"Error");return j}
async function placeAll(){const g=groups();try{for(const sid in g){const st=STORES.find(x=>x.id==sid),items=g[sid].map(([p,q])=>[p.id,q]),sub=g[sid].reduce((a,[p,q])=>a+p.p*q,0);let oid=Math.floor(1000+Math.random()*9000);
if(S.live){const r=await api("/orders",{storeId:sid,items:items.map(([productId,qty])=>({productId,qty})),name:S.name,phone:ph10(),address:S.addr,slot:TXT.en.slots[S.slot],payment:S.pay});oid=r.orderId}
S.orders.unshift({id:oid,s:sid,items,tot:sub+st.fee,slot:+S.slot,pay:S.pay,st:0,live:S.live,ph:ph10()});g[sid].forEach(([p])=>delete S.cart[p.id])}
S.view="orders";S.busy=false;save();render();say(t("placed"))}catch(e){S.busy=false;save();render();say(e.message)}}
document.addEventListener("change",e=>{const el=e.target;
if(el.id==="file"&&el.files[0]){S.draft.img=URL.createObjectURL(el.files[0]);render()}
else if(el.dataset.a==="consent"){S.draft.ok=el.checked;render()}
else if(el.dataset.in==="slot")S.slot=+el.value;else if(el.dataset.in==="pay")S.pay=el.value});
document.addEventListener("input",e=>{const k=e.target.dataset.in;if(k==="addr"||k==="name"||k==="phone"){S[k]=e.target.value;save()}});
const FLOW=["PLACED","ACCEPTED","PACKED","OUT_FOR_DELIVERY","DELIVERED"];
setInterval(()=>{let ch=false;S.orders.forEach(o=>{if(!o.live&&o.st<4){o.st++;ch=true}});if(ch){save();if(S.view==="orders")render()}},9000);
setInterval(async()=>{let ch=false;for(const o of S.orders){if(o.live&&o.st<4&&!o.rej){try{const r=await api("/orders/"+o.id+"?phone="+o.ph);const i=FLOW.indexOf(r.status);if(r.status==="REJECTED"){o.rej=true;ch=true}else if(i>o.st){o.st=i;ch=true}}catch(e){}}}if(ch){save();if(S.view==="orders")render()}},15000);
async function loadCatalog(){try{const st=(await api("/stores")).items;if(!st.length)return;const SS=[],PP=[];
for(const x of st){const id=String(x.ROWID);SS.push({id,i:/milk|dairy/i.test(x.name_en)?"🥛":/veg|fruit/i.test(x.name_en)?"🥬":"🛒",en:x.name_en,ta:x.name_ta||x.name_en,fee:+x.delivery_fee,min:+x.min_order,eta:x.eta||"",wa:x.whatsapp||""});
(await api("/stores/"+id+"/products")).items.forEach(q=>PP.push({id:String(q.ROWID),s:id,en:q.name_en,ta:q.name_ta||q.name_en,u:q.unit,p:+q.price}))}
STORES.splice(0,STORES.length,...SS);P.splice(0,P.length,...PP);S.live=true;S.cart=Object.fromEntries(Object.entries(S.cart).filter(([k])=>byId(k)));S.orders=S.orders.filter(o=>o.live||!SS.length);render()}catch(e){}}
render();loadCatalog();
</script>
</body>
</html>
